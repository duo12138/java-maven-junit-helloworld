name: CI

on:
  pull_request:
  push:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 走查核心：verify 会跑单测 + 集成测（若项目配置了 failsafe），并触发 JaCoCo 报告（该示例仓库说明如此）
      - name: Build & Verify
        run: mvn -B --no-transfer-progress clean verify

      # 把测试报告、覆盖率报告作为构建产物上传，方便在 Actions 里直接下载查看
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco*/**
